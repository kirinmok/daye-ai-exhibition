<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貪婪之星：終極探險版</title>
    <style>
        :root {
            --bg-color: #0f0f15;
            --panel-bg: rgba(25, 25, 35, 0.65);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary: #06d6a0;
            --primary-glow: rgba(6, 214, 160, 0.4);
            --danger: #ef476f;
            --danger-glow: rgba(239, 71, 111, 0.4);
            --warning: #ffd166;
            --info: #00b4d8;
            --text-main: #f8f9fa;
            --text-muted: #8e9aaf;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 遊戲主容器 */
        .game-container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 頂部資訊面板 */
        .dashboard {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dashboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-box {
            display: flex;
            flex-direction: column;
        }

        .score-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .score-value.highlight {
            background: linear-gradient(135deg, var(--warning) 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 生命值與護盾樣式 */
        .status-indicators {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hearts-container {
            display: flex;
            gap: 4px;
        }

        .heart-icon {
            width: 24px;
            height: 24px;
            fill: var(--danger);
            filter: drop-shadow(0 0 4px var(--danger-glow));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart-icon.lost {
            fill: #374151;
            filter: none;
            transform: scale(0.8) rotate(-15deg);
        }

        .shield-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(112, 224, 0, 0.1);
            border: 1px solid rgba(112, 224, 0, 0.3);
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #70e000;
            transition: all 0.3s ease;
            opacity: 0.3;
        }

        .shield-badge.active {
            opacity: 1;
            background: rgba(112, 224, 0, 0.2);
            border-color: rgba(112, 224, 0, 0.6);
            box-shadow: 0 0 10px rgba(112, 224, 0, 0.2);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        /* 核心舞台區 */
        .stage {
            width: 100%;
            height: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--panel-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* 舞台光暈 */
        .stage::before {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        .item-display-wrapper {
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .item-display-wrapper.draw-anim {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .stage.shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15%, 45%, 75% { transform: translateX(-8px); }
            30%, 60%, 90% { transform: translateX(8px); }
        }

        .item-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 15px;
            z-index: 2;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .item-effect {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            z-index: 2;
            min-height: 1.2rem;
            text-align: center;
            max-width: 80%;
        }

        /* 本輪暫存分數框 */
        .temp-score-wrapper {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 20px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
        }

        .temp-score-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .temp-score-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
            transition: all 0.2s ease;
        }

        .temp-score-value.scale-up {
            transform: scale(1.2);
        }

        /* 控制按鈕區 */
        .controls {
            display: flex;
            gap: 14px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 16px 12px;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:active::after {
            opacity: 1;
        }

        .btn-sub-text {
            font-size: 0.7rem;
            font-weight: 500;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .btn-no {
            background: linear-gradient(135deg, var(--danger) 0%, #d9385c 100%);
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(239, 71, 111, 0.3);
        }

        .btn-no:disabled {
            background: #27273a;
            color: #52526b;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-yes {
            background: linear-gradient(135deg, var(--primary) 0%, #05b184 100%);
            color: #0f172a;
            box-shadow: 0 6px 20px rgba(6, 214, 160, 0.3);
        }

        /* 歷史軌跡軌道 */
        .history-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .history-track {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            min-height: 38px;
            align-items: center;
            scrollbar-width: none; /* Firefox */
        }

        .history-track::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .history-item {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .history-item svg {
            width: 18px;
            height: 18px;
        }

        .history-empty {
            font-size: 0.8rem;
            color: #4b5563;
            font-style: italic;
        }

        /* 自訂彈窗樣式 (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 15, 21, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: radial-gradient(circle at 50% 0%, #2e1022 0%, #181824 100%);
            border: 2px solid rgba(239, 71, 111, 0.3);
            border-radius: 28px;
            width: 100%;
            max-width: 400px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            filter: drop-shadow(0 0 10px rgba(239, 71, 111, 0.5));
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-main);
            margin: 0 0 8px;
        }

        .modal-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* 戰績網格 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--warning);
        }

        .stat-lbl {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .modal-btn {
            background: linear-gradient(135deg, var(--primary) 0%, #05b184 100%);
            color: #0f172a;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 20px rgba(6, 214, 160, 0.3);
            transition: all 0.2s;
        }

        .modal-btn:active {
            transform: scale(0.96);
        }

        /* 安全入庫漂浮字特效 */
        .floating-score {
            position: absolute;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
            animation: floatUp 1.2s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.4); opacity: 0; }
        }

        /* SVG 圖標庫 */
        .svg-defs {
            position: absolute;
            width: 0; height: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- 遊戲主畫面 -->
    <div class="game-container">
        
        <!-- 頂部面板 -->
        <div class="dashboard">
            <div class="dashboard-row">
                <div class="score-box">
                    <span class="score-label">🏦 銀行總分</span>
                    <span class="score-value" id="total-score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">🏆 最高紀錄</span>
                    <span class="score-value highlight" id="best-score">0</span>
                </div>
            </div>
            <div class="dashboard-row" style="margin-top: 4px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                <div class="hearts-container" id="hearts-box">
                    <!-- JS 動態生成生命愛心 -->
                </div>
                <div class="shield-badge" id="shield-badge">
                    <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span>護盾未啟動</span>
                </div>
            </div>
        </div>

        <!-- 舞台展示區 -->
        <div class="stage" id="stage">
            <div class="item-display-wrapper" id="item-icon-container">
                <!-- 預設啟動圖標 -->
                <svg viewBox="0 0 24 24" style="width:80px; height:80px; fill:#ffd166; filter:drop-shadow(0 0 12px rgba(255,209,102,0.4));">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>
            </div>
            <div class="item-name" id="item-name">歡迎來到貪婪之星</div>
            <div class="item-effect" id="item-effect">首抽安全保護已啟動！點擊下方「探索」開始。</div>
            
            <div class="temp-score-wrapper">
                <span class="temp-score-label">本輪暫存:</span>
                <span class="temp-score-value" id="current-score">0</span>
            </div>
        </div>

        <!-- 按鈕區 -->
        <div class="controls">
            <button class="btn btn-no" id="btn-no" disabled>
                <span>收手</span>
                <span class="btn-sub-text">安全入庫</span>
            </button>
            <button class="btn btn-yes" id="btn-yes">
                <span>探索</span>
                <span class="btn-sub-text">冒險下一抽</span>
            </button>
        </div>

        <!-- 軌跡區 -->
        <div class="history-container">
            <div class="history-title">本輪軌跡 (路徑紀錄)</div>
            <div class="history-track" id="history-track">
                <span class="history-empty">尚未啟程...</span>
            </div>
        </div>
    </div>

    <!-- 結算彈窗 (Modal) -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-icon" id="modal-icon">
                <!-- 動態注入爆炸或獎盃圖標 -->
            </div>
            <h2 class="modal-title" id="modal-title">遊戲結束</h2>
            <p class="modal-subtitle" id="modal-subtitle">您的貪婪在這裡畫下了句點。</p>
            
            <!-- 數據統計 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-val" id="stat-final-score">0</span>
                    <span class="stat-lbl">本次最終得分</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-peak-combo">0</span>
                    <span class="stat-lbl">單輪最高探險</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-shields-used">0</span>
                    <span class="stat-lbl">盾牌抵擋次數</span>
                </div>
                <div class="stat-card">
                    <span class="stat-val" id="stat-greed-rating">初學者</span>
                    <span class="stat-lbl">貪婪指數評級</span>
                </div>
            </div>

            <button class="modal-btn" id="modal-restart-btn">重整旗鼓</button>
        </div>
    </div>

    <!-- SVG 定義庫 (供 JS 重複使用) -->
    <svg class="svg-defs">
        <defs>
            <!-- 灰色方塊 -->
            <g id="svg-grey-cube">
                <rect x="2" y="2" width="20" height="20" rx="4" fill="#64748b" />
                <rect x="5" y="5" width="14" height="14" rx="2" fill="#475569" />
            </g>
            <!-- 紫色方塊 -->
            <g id="svg-purple-cube">
                <rect x="2" y="2" width="20" height="20" rx="4" fill="#a855f7" />
                <polygon points="12,5 19,12 12,19 5,12" fill="#7e22ce" />
            </g>
            <!-- 藍色方塊 -->
            <g id="svg-blue-cube">
                <rect x="2" y="2" width="20" height="20" rx="4" fill="#3b82f6" />
                <circle cx="12" cy="12" r="6" fill="#1d4ed8" />
            </g>
            <!-- 黃金星星 -->
            <g id="svg-gold-star">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#f59e0b" filter="url(#glow)" />
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="1" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </g>
            <!-- 鑽石道具 -->
            <g id="svg-diamond">
                <polygon points="12,2 21,9 17,21 7,21 3,9" fill="#06b6d4" />
                <polygon points="12,6 18,11 15,19 9,19 6,11" fill="#22d3ee" />
            </g>
            <!-- 魔法護盾 -->
            <g id="svg-shield">
                <path d="M12 2L4 5v6c0 5.52 4.48 10 8 11 3.52-1 8-5.48 8-11V5l-8-3z" fill="#22c55e" />
                <path d="M12 5l6 2.25V11c0 4.14-3.14 7.5-6 8.25V5z" fill="#4ade80" opacity="0.6"/>
            </g>
            <!-- 黑色炸彈 -->
            <g id="svg-bomb">
                <!-- 導火線 -->
                <path d="M14 6c1-1 3-1 3-3" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" fill="none" />
                <!-- 火花 -->
                <circle cx="17" cy="3" r="2" fill="#ef476f" />
                <path d="M17 3l2-2M17 3l-2 2M17 3l2 2M17 3l-2-2" stroke="#ffd166" stroke-width="1" />
                <!-- 炸彈本體 -->
                <circle cx="11" cy="13" r="8" fill="#1e293b" />
                <circle cx="9" cy="11" r="2" fill="#64748b" />
            </g>
        </defs>
    </svg>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 核心變數
            let totalScore = 0;
            let currentScore = 0;
            let lives = 3;
            let hasShield = false;
            let isFirstTurn = true;
            let currentHistory = [];
            let gameActive = true;
            
            // 賽局 telemetry (教育與統計指標)
            let stats = {
                peakCombo: 0,       // 單輪最長存活鏈
                shieldsUsed: 0,     // 護盾消耗數
                bombsEncountered: 0,// 遇到炸彈次數
                totalTurns: 0       // 總抽牌次數
            };

            // 讀取最高分數
            let bestScore = localStorage.getItem('g_stars_b') ? parseInt(localStorage.getItem('g_stars_b')) : 0;
            document.getElementById('best-score').innerText = bestScore;

            // 遊戲道具數據定義 (使用內嵌 SVG 名稱)
            const items = [
                { name: '灰色方塊', svgId: 'svg-grey-cube', color: '#64748b', type: 'plus', value: 1, weight: 3, effect: '基礎加成：分數直接 +1' },
                { name: '紫色方塊', svgId: 'svg-purple-cube', color: '#a855f7', type: 'multiply', value: 2, weight: 2.5, effect: '翻倍加成：目前分數 ×2！' },
                { name: '藍色方塊', svgId: 'svg-blue-cube', color: '#3b82f6', type: 'multiply', value: 3, weight: 1.5, effect: '強效加成：目前分數 ×3！' },
                { name: '黃金星星', svgId: 'svg-gold-star', color: '#f59e0b', type: 'multiply', value: 5, weight: 0.8, effect: '史詩奇蹟：目前分數大爆發 ×5！' },
                { name: '鑽石道具', svgId: 'svg-diamond', color: '#06b6d4', type: 'plus', value: 10, weight: 0.6, effect: '傳奇寶藏：分數直接爆加 +10！' },
                { name: '魔法護盾', svgId: 'svg-shield', color: '#22c55e', type: 'shield', value: 0, weight: 0.6, effect: '守護庇護：獲得一次抵擋炸彈的機會！' },
                { name: '黑色炸彈', svgId: 'svg-bomb', color: '#ef476f', type: 'bomb', value: 0, weight: 1.8, effect: '致命危機：本輪分數歸零並損失生命值！' }
            ];

            // 初始化生命愛心
            function updateHeartsUI() {
                const heartsBox = document.getElementById('hearts-box');
                heartsBox.innerHTML = '';
                for (let i = 1; i <= 3; i++) {
                    const heart = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    heart.setAttribute("viewBox", "0 0 24 24");
                    heart.classList.add("heart-icon");
                    if (i > lives) {
                        heart.classList.add("lost");
                    }
                    heart.innerHTML = `<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>`;
                    heartsBox.appendChild(heart);
                }
            }

            // 行動端微震動反饋
            function triggerVibrate(pattern) {
                if ('vibrate' in navigator) {
                    navigator.vibrate(pattern);
                }
            }

            // 產生對應 SVG 圖標結構
            function getSvgHtml(svgId, size = 100) {
                return `
                    <svg viewBox="0 0 24 24" style="width:${size}px; height:${size}px;">
                        <use href="#${svgId}" />
                    </svg>
                `;
            }

            // 點擊「探索」邏輯
            function handleYes() {
                if (!gameActive) return;

                stats.totalTurns++;
                triggerVibrate(20); // 輕微觸摸反饋

                // 移除舞台搖晃動畫與翻轉動畫
                const stage = document.getElementById('stage');
                const iconContainer = document.getElementById('item-icon-container');
                stage.classList.remove('shake');
                iconContainer.classList.remove('draw-anim');
                
                // 強制瀏覽器重繪以重新觸發動畫
                void iconContainer.offsetWidth; 

                // 首抽排除炸彈
                let validItems = items.filter(i => !(isFirstTurn && i.type === 'bomb'));
                
                // 加權隨機演算法
                let totalWeight = validItems.reduce((sum, item) => sum + item.weight, 0);
                let random = Math.random() * totalWeight;
                let selectedItem = validItems[0];

                for (const i of validItems) {
                    if (random < i.weight) {
                        selectedItem = i;
                        break;
                    }
                    random -= i.weight;
                }

                isFirstTurn = false;
                document.getElementById('btn-no').disabled = false; // 抽過一次即可安全收手

                // 舞台邊框與發光效果
                stage.style.borderColor = selectedItem.color;
                stage.style.boxShadow = `0 12px 40px rgba(${hexToRgb(selectedItem.color)}, 0.25)`;

                // 渲染抽中道具
                iconContainer.innerHTML = getSvgHtml(selectedItem.svgId, 100);
                iconContainer.classList.add('draw-anim');

                const nameEl = document.getElementById('item-name');
                nameEl.innerText = selectedItem.name;
                nameEl.style.color = selectedItem.color;
                document.getElementById('item-effect').innerText = selectedItem.effect;

                // 邏輯處理
                if (selectedItem.type === 'plus') {
                    // 分數 +n
                    currentScore += selectedItem.value;
                    pushToHistory(selectedItem.svgId);
                } else if (selectedItem.type === 'multiply') {
                    // 分數 *n，如果當前是 0 則視作初始值
                    currentScore = currentScore === 0 ? selectedItem.value : currentScore * selectedItem.value;
                    pushToHistory(selectedItem.svgId);
                } else if (selectedItem.type === 'shield') {
                    // 獲得護盾
                    hasShield = true;
                    pushToHistory(selectedItem.svgId);
                    const shieldBadge = document.getElementById('shield-badge');
                    shieldBadge.classList.add('active');
                    shieldBadge.querySelector('span').innerText = '護盾保護中';
                } else if (selectedItem.type === 'bomb') {
                    stats.bombsEncountered++;
                    stage.classList.add('shake');
                    
                    if (hasShield) {
                        // 盾牌抵擋
                        hasShield = false;
                        stats.shieldsUsed++;
                        triggerVibrate([100, 50, 100]); // 護盾破裂雙震
                        
                        const shieldBadge = document.getElementById('shield-badge');
                        shieldBadge.classList.remove('active');
                        shieldBadge.querySelector('span').innerText = '護盾已破裂';
                        
                        nameEl.innerText = "🛡️ 護盾抵擋成功！";
                        nameEl.style.color = "#70e000";
                        document.getElementById('item-effect').innerText = "強大的魔法護盾替你擋下了致命的爆炸！";
                    } else {
                        // 炸彈引爆
                        currentScore = 0;
                        lives--;
                        triggerVibrate([300, 100, 300]); // 炸彈引爆重震
                        
                        updateHeartsUI();
                        clearHistory();
                        isFirstTurn = true;
                        
                        nameEl.innerText = "💥 轟隆！炸彈引爆！";
                        nameEl.style.color = "var(--danger)";
                        document.getElementById('item-effect').innerText = "本輪暫存分數全數歸零，並失去 1 點生命值！";
                        
                        document.getElementById('btn-no').disabled = true; // 爆掉後不可收手

                        if (lives <= 0) {
                            gameActive = false;
                            showGameOverModal();
                            return;
                        }
                    }
                }

                // 數值增加動畫效果
                const scoreValueEl = document.getElementById('current-score');
                scoreValueEl.innerText = currentScore;
                scoreValueEl.classList.add('scale-up');
                setTimeout(() => scoreValueEl.classList.remove('scale-up'), 200);

                // 計算單輪最大探險深度
                if (currentHistory.length > stats.peakCombo) {
                    stats.peakCombo = currentHistory.length;
                }
            }

            // 點擊「收手」邏輯
            function handleNo() {
                if (!gameActive || currentScore === 0) return;

                // 產生漂浮數字動畫
                createFloatingScoreEffect(`+${currentScore}`);
                triggerVibrate([30, 30, 30]);

                totalScore += currentScore;
                
                // 最高紀錄更新
                if (totalScore > bestScore) {
                    bestScore = totalScore;
                    localStorage.setItem('g_stars_b', bestScore);
                    document.getElementById('best-score').innerText = bestScore;
                }

                currentScore = 0;
                clearHistory();
                isFirstTurn = true;

                // 更新 UI
                document.getElementById('total-score').innerText = totalScore;
                document.getElementById('current-score').innerText = currentScore;
                document.getElementById('btn-no').disabled = true;

                // 恢復舞台初始狀態
                document.getElementById('item-icon-container').innerHTML = `
                    <svg viewBox="0 0 24 24" style="width:80px; height:80px; fill:var(--primary); filter:drop-shadow(0 0 12px var(--primary-glow));">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                `;
                document.getElementById('item-name').innerText = '安全落袋！';
                document.getElementById('item-name').style.color = 'var(--primary)';
                document.getElementById('item-effect').innerText = '分數已成功存入銀行。準備好開始下一輪了嗎？';
                document.getElementById('stage').style.borderColor = 'var(--panel-border)';
                document.getElementById('stage').style.boxShadow = 'none';
            }

            // 歷史軌跡輔助函式
            function pushToHistory(svgId) {
                currentHistory.push(svgId);
                const track = document.getElementById('history-track');
                
                // 首次抽牌時移除「尚未啟程」提示
                if (currentHistory.length === 1) {
                    track.innerHTML = '';
                }

                const itemDiv = document.createElement('div');
                itemDiv.classList.add('history-item');
                itemDiv.innerHTML = getSvgHtml(svgId, 18);
                track.appendChild(itemDiv);

                // 自動滾動到最右端
                track.scrollLeft = track.scrollWidth;
            }

            function clearHistory() {
                currentHistory = [];
                document.getElementById('history-track').innerHTML = '<span class="history-empty">重新出發...</span>';
            }

            // 漂浮分數特效
            function createFloatingScoreEffect(text) {
                const stage = document.getElementById('stage');
                const floater = document.createElement('div');
                floater.classList.add('floating-score');
                floater.innerText = text;
                floater.style.left = '50%';
                floater.style.top = '40%';
                floater.style.transform = 'translate(-50%, -50%)';
                stage.appendChild(floater);

                setTimeout(() => {
                    floater.remove();
                }, 1200);
            }

            // 遊戲結束彈窗控制
            function showGameOverModal() {
                document.getElementById('stat-final-score').innerText = totalScore;
                document.getElementById('stat-peak-combo').innerText = stats.peakCombo;
                document.getElementById('stat-shields-used').innerText = stats.shieldsUsed;
                
                // 貪婪評級邏輯
                let rating = '知足常樂';
                if (totalScore === 0) {
                    rating = '空手而歸';
                } else if (stats.peakCombo >= 12) {
                    rating = '貪婪主宰';
                } else if (stats.peakCombo >= 8) {
                    rating = '刀口舔血';
                } else if (stats.peakCombo >= 5) {
                    rating = '穩健行者';
                }
                document.getElementById('stat-greed-rating').innerText = rating;

                // 彈窗圖標與標題客製化
                const modalIcon = document.getElementById('modal-icon');
                if (totalScore >= bestScore && totalScore > 0) {
                    document.getElementById('modal-title').innerText = '🎉 創下新紀錄！';
                    document.getElementById('modal-subtitle').innerText = '你在這場與機率的博弈中展現了絕妙的膽識！';
                    modalIcon.innerHTML = `
                        <svg viewBox="0 0 24 24" style="width:70px; height:70px; fill:var(--warning);">
                            <path d="M19 5h-14V3h14v2zm0 4h-2V7h2v2zm-12 0H5V7h2v2zm10 4c0 2.21-1.79 4-4 4s-4-1.79-4-4V5h8v8z"/>
                        </svg>
                    `;
                } else {
                    document.getElementById('modal-title').innerText = 'Game Over';
                    document.getElementById('modal-subtitle').innerText = '生命值已耗盡，銀行家強制結算！';
                    modalIcon.innerHTML = `
                        <svg viewBox="0 0 24 24" style="width:70px; height:70px; fill:var(--danger);">
                            <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    `;
                }

                document.getElementById('modal-overlay').classList.add('active');
            }

            function resetGame() {
                // 關閉彈窗
                document.getElementById('modal-overlay').classList.remove('active');

                // 數值歸零
                totalScore = 0;
                currentScore = 0;
                lives = 3;
                hasShield = false;
                gameActive = true;
                isFirstTurn = true;
                
                stats = {
                    peakCombo: 0,
                    shieldsUsed: 0,
                    bombsEncountered: 0,
                    totalTurns: 0
                };

                // UI 重置
                document.getElementById('total-score').innerText = 0;
                document.getElementById('current-score').innerText = 0;
                document.getElementById('btn-no').disabled = true;
                
                const shieldBadge = document.getElementById('shield-badge');
                shieldBadge.classList.remove('active');
                shieldBadge.querySelector('span').innerText = '護盾未啟動';

                updateHeartsUI();
                clearHistory();

                // 舞台恢復
                document.getElementById('item-icon-container').innerHTML = `
                    <svg viewBox="0 0 24 24" style="width:80px; height:80px; fill:#ffd166; filter:drop-shadow(0 0 12px rgba(255,209,102,0.4));">
                        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                    </svg>
                `;
                document.getElementById('item-name').innerText = '歡迎來到貪婪之星';
                document.getElementById('item-name').style.color = 'var(--text-main)';
                document.getElementById('item-effect').innerText = '首抽安全保護已啟動！點擊下方「探索」開始。';
                document.getElementById('stage').style.borderColor = 'var(--panel-border)';
                document.getElementById('stage').style.boxShadow = 'none';
            }

            // 色彩轉換小套件 (Hex to RGB 供陰影計算)
            function hexToRgb(hex) {
                const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
                hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255, 255, 255';
            }

            // 事件監聽
            document.getElementById('btn-yes').addEventListener('click', handleYes);
            document.getElementById('btn-no').addEventListener('click', handleNo);
            document.getElementById('modal-restart-btn').addEventListener('click', resetGame);

            // 初始化呼叫
            updateHeartsUI();
        });
    </script>
</body>
</html>
