<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深淵騎士 (2D Action Platformer)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050a08;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1f2937;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="text-white font-sans select-none">

    <canvas id="gameCanvas"></canvas>

    <!-- UI 層 -->
    <div id="ui-layer" class="flex flex-col justify-between p-4 relative z-40">
        <div class="flex justify-between items-start">
            <div class="bg-gray-900 bg-opacity-80 rounded-lg p-3 border border-gray-700 shadow-lg flex items-center gap-4">
                <div class="text-xl font-bold text-cyan-400">魂魄: <span id="scoreDisplay">0</span></div>
            </div>
            
            <div class="bg-gray-900 bg-opacity-80 rounded-lg p-3 border border-gray-700 shadow-lg w-64">
                <div class="flex justify-between mb-1">
                    <span class="text-sm font-bold text-gray-300">生命值</span>
                    <span id="hpText" class="text-sm font-bold text-red-400">20 / 20</span>
                </div>
                <div class="w-full bg-gray-800 h-4 rounded-full overflow-hidden border border-gray-700">
                    <div id="hpBar" class="bg-red-500 h-full transition-all duration-200" style="width: 100%;"></div>
                </div>
                <div class="w-full bg-gray-800 h-1.5 mt-2 rounded-full overflow-hidden flex">
                    <div id="dashBar" class="bg-cyan-400 h-full transition-all duration-75" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <div id="location-banner" class="absolute bottom-32 left-8 z-[100] pointer-events-none transition-opacity duration-[1500ms] opacity-0">
            <h2 id="loc-title" class="text-5xl font-black text-white tracking-[0.5em] drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] opacity-90">下水道</h2>
            <div id="loc-line" class="h-1 w-full bg-gradient-to-r from-green-600 to-transparent mt-2"></div>
            <p id="loc-subtitle" class="text-green-400 font-bold tracking-widest mt-1 text-sm uppercase opacity-80">Sewer Area</p>
        </div>

        <div id="memory-unlock-banner" class="absolute bottom-10 right-8 z-[100] pointer-events-none transition-opacity duration-[1000ms] opacity-0 text-right">
            <h3 class="text-2xl font-bold text-purple-400 drop-shadow-[0_0_10px_rgba(147,51,234,0.8)] tracking-widest">[回憶已找回]</h3>
        </div>

        <div id="save-banner" class="absolute bottom-20 right-8 z-[100] pointer-events-none transition-opacity duration-500 opacity-0 text-right">
            <h3 class="text-lg font-bold text-green-400 drop-shadow-[0_0_5px_rgba(34,197,94,0.8)] tracking-widest animate-pulse">[存檔中...]</h3>
        </div>

        <div class="absolute bottom-4 left-4 flex gap-3">
            <div class="relative w-14 h-14 bg-gray-900 border-2 border-gray-600 rounded-lg flex flex-col items-center justify-center shadow-lg overflow-hidden">
                <span class="text-gray-400 text-xs font-bold z-10 mb-1" id="hud-attack-name">揮拳</span>
                <span class="text-cyan-300 font-bold text-lg z-10">J</span>
                <div id="hud-cd-attack" class="absolute bottom-0 left-0 w-full bg-black bg-opacity-80 z-20" style="height: 0%;"></div>
            </div>
            <div class="relative w-14 h-14 bg-gray-900 border-2 border-gray-600 rounded-lg flex flex-col items-center justify-center shadow-lg overflow-hidden">
                <span class="text-gray-400 text-xs font-bold z-10 mb-1">衝刺</span>
                <span class="text-cyan-300 font-bold text-lg z-10">K</span>
                <span id="hud-dash-charges" class="absolute top-1 right-1 text-xs text-yellow-400 font-bold z-30 drop-shadow-md">3</span>
                <div id="hud-cd-dash" class="absolute bottom-0 left-0 w-full bg-black bg-opacity-80 z-20" style="height: 0%;"></div>
            </div>
        </div>
    </div>

    <!-- 遊戲開始/結束畫面 -->
    <div id="overlay" class="interactive absolute inset-0 bg-black bg-opacity-90 flex flex-col items-center justify-center backdrop-blur-md transition-opacity duration-300 z-[60]">
        <h1 id="overlayTitle" class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 mb-2 drop-shadow-[0_0_15px_rgba(34,211,238,0.5)] tracking-widest">深淵騎士</h1>
        <p id="overlayDesc" class="text-xl text-gray-400 mb-10 tracking-wide">探索無盡的黑暗，找回失落的記憶</p>
        <p id="finalScore" class="text-2xl text-cyan-400 font-bold mb-8 hidden">收集魂魄: <span>0</span></p>
        <button id="startBtn" class="px-10 py-4 bg-transparent border-2 border-cyan-500 text-cyan-400 hover:bg-cyan-500 hover:text-white text-xl font-bold rounded shadow-[0_0_15px_rgba(34,211,238,0.3)] transition-all duration-200">
            開始輪迴
        </button>
    </div>

    <!-- 背包/技能介面 -->
    <div id="inventory-layer" class="interactive absolute inset-0 bg-black bg-opacity-80 flex flex-col items-center justify-center backdrop-blur-md transition-opacity duration-300 hidden p-2 md:p-6 z-50">
        <div class="bg-gray-900 border-2 border-cyan-500 rounded-xl p-3 md:p-5 w-full max-w-4xl h-[95vh] md:h-[85vh] shadow-[0_0_30px_rgba(34,211,238,0.2)] text-gray-200 flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-700 pb-2 mb-3 shrink-0">
                <h2 class="text-xl md:text-2xl font-bold text-cyan-400 tracking-wider">角色選單 <span id="editor-badge" class="text-sm bg-red-600 px-2 rounded ml-2 hidden animate-pulse">編輯者模式</span></h2>
                <div class="text-gray-400 text-xs md:text-sm">狀態：<span class="text-yellow-400 font-bold">遊戲暫停</span> | 擁有魂魄: <span id="inv-soul-display" class="text-cyan-300 font-bold text-sm md:text-base">0</span></div>
            </div>
            <div class="flex-1 w-full overflow-hidden" id="inventory-content-wrapper"></div>
        </div>
        <p class="mt-2 text-gray-400 text-xs md:text-sm font-bold animate-pulse shrink-0">按下 <kbd class="bg-gray-800 border border-gray-600 px-2 py-1 rounded">Tab</kbd> 返回遊戲</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const scoreDisplay = document.getElementById('scoreDisplay');
        const hpBar = document.getElementById('hpBar');
        const hpText = document.getElementById('hpText');
        const dashBar = document.getElementById('dashBar');
        const overlay = document.getElementById('overlay');
        const inventoryLayer = document.getElementById('inventory-layer');
        const inventoryContentWrapper = document.getElementById('inventory-content-wrapper');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const finalScore = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const locationBanner = document.getElementById('location-banner');
        const saveBanner = document.getElementById('save-banner');
        const memoryUnlockBanner = document.getElementById('memory-unlock-banner');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 系統變數
        const keys = {
            a: false, d: false, w: false, s: false, j: false, k: false, e: false, r: false,
            ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false,
            ' ': false, Shift: false
        };
        const keysPressed = {};
        let gameLoopId = null;

        const globalSettings = { showDamage: false, showEnemyHP: false, showHitbox: false };

        // 編輯者模式
        let editorMode = false;
        let keyBuffer = '';
        let lastKeyTime = 0;
        let lastSpacePressTime = 0;

        // 資料庫
        const equipmentData = {
            weapons: [
                { id: 'abyssal_blade', name: '[深淵黑刃]', icon: `<svg viewBox="0 0 64 64" class="w-full h-full transform -rotate-45 drop-shadow-[0_0_2px_rgba(255,255,255,0.4)]"><rect x="28" y="42" width="8" height="18" fill="#111" stroke="#333" stroke-width="1"/><path d="M18,42 L46,42 L46,46 L18,46 Z" fill="#900c3f"/><path d="M30,6 L34,6 L36,42 L28,42 Z" fill="#050505" stroke="#fff" stroke-width="0.5"/><path d="M30,6 L32,0 L34,6 Z" fill="#fff"/></svg>`, desc: '隱沒於暗處的鋒刃，揮舞時會扯裂空間。', rarity: 'text-yellow-400' }
            ], armors: [], accessories: [], legs: []
        };
        let currentEquip = { weapon: null, armor: null, accessory: null, legs: null };

        const codexData = {
            enemies: [
                { id: 'shadow_walker', name: '[虛空行者]', hp: '35', speed: '20 (平時) / 450 (衝撞)', drop: '暫無', attack: '近身衝撞 (距離 0, 傷害 2)', desc: '徘徊在深淵下水道的無意識個體。平時移動緩慢，但一旦靠近便會突然加速衝撞。', svg: `<svg viewBox="0 0 60 100" class="w-16 h-24 mx-auto drop-shadow-lg scale-110 mt-2"><line x1="26" y1="50" x2="26" y2="70" stroke="#050505" stroke-width="6" stroke-linecap="round"/><line x1="34" y1="50" x2="34" y2="70" stroke="#050505" stroke-width="6" stroke-linecap="round"/><rect x="20" y="20" width="20" height="32" rx="6" fill="#2a1616"/><path d="M22,25 L18,45 M38,25 L42,45" stroke="#4a1a1a" stroke-width="5"/><circle cx="35" cy="15" r="12" fill="#2d1b1b"/><circle cx="40" cy="13" r="2" fill="#e74c3c"/></svg>` },
                { id: 'variant_001', name: '[002 變體樣本:1]', hp: '15', speed: '20 (平時) / 600 (衝撞)', drop: '靈魂 (70)', attack: '向前突進 (距離 100, 傷害 1)', desc: '實驗室玻璃罐中孵化出的變異黑色史萊姆。動作詭異，會對入侵者發動距離達100的衝刺攻擊。', svg: `<svg viewBox="0 0 60 60" class="w-16 h-16 mx-auto drop-shadow-lg scale-125 mt-4"><path d="M10,50 Q10,20 30,20 Q50,20 50,50 Z" fill="#111111"/><circle cx="38" cy="35" r="4" fill="#e74c3c"/><path d="M15,50 Q30,55 45,50" stroke="#000" stroke-width="3" fill="none"/></svg>` }
            ], materials: []
        };

        const skillsData = {
            ground: { id: 'ground', name: '[普通砍]', evolvedName: '[影刃]', desc: '基礎的地面揮擊，速度極快。', evoDesc: '進階暗殺劍術。連續施放觸發三段連招，附帶半月影刃。', range: '長130 寬100', evoRange: '一:長140寬110 | 二:雙向十字 | 三:長160寬110+飛刃', special: '[無]', evoSpecial: '[三段連招] 第三段發射移動速度300的黑月刀光。' },
            airUp: { id: 'airUp', name: '[上砍]', evolvedName: '[半月斬]', desc: '起跳初期的對空斬擊。', evoDesc: '巨大範圍的毀滅性上斬。', range: '長120 寬200', evoRange: '長200 寬270', special: '[無]', evoSpecial: '[無]' },
            airLong: { id: 'airLong', name: '[空中斬]', evolvedName: '[輪月斬]', desc: '滯空過久時的長距離橫掃。', evoDesc: '以自身為中心釋放十字交錯的狂暴斬擊。', range: '長170 寬135 (雙向)', evoRange: '長260 寬180 (中心爆發)', special: '[無]', evoSpecial: '[無]' },
            plunge: { id: 'plunge', name: '[下落攻擊]', evolvedName: '[落月擊]', desc: '自空中極速墜落引發衝擊。', evoDesc: '墜落時將大地粉碎的重擊，附帶短暫暈眩。', range: '長140 寬30', evoRange: '隨墜落距離大幅擴張', special: '[衝擊] 每下落150像素增傷', evoSpecial: '[隕星] 隨距離增傷+150%、範圍暴增並附帶暈眩' }
        };
        const passiveSkillsData = { dash: { id: 'dash', name: '[衝刺]', desc: '快速向前突進，賦予短暫無敵幀與空中緩降。', special: '[無敵] 0.3秒', locked: true } };

        let skillsProgress = { ground: { level: 1, evolved: false }, airUp: { level: 1, evolved: false }, airLong: { level: 1, evolved: false }, plunge: { level: 1, evolved: false } };

        let invState = { tab: 'combat', weaponExpanded: false, selectingEquipSlot: null, codexCategory: null, selectedCodexItem: null };
        let introState = 'none'; let introTimer = 0; let jPressCount = 0; let tankShattered = false; let currentZone = '';
        let groundBlade = { x: -3100, y: 0, pickedUp: false }; 
        let ironDoor = { x: -20, y: 0, w: 20, h: 200, hp: 1, isBroken: false, lastPromptTime: 0 };
        let bossEventTriggered = false; let bossCutsceneState = 'none'; let bossCutsceneTimer = 0; let bossTankBroken = false;
        
        let timeScale = 1.0; let slowMoTimer = 0;
        const unlockedMemories = new Set();
        let gamePlayer;
        let savePoint = { x: -2850, y: 0, name: '實驗室-甦醒' }; 
        let hasSavedSewer = false;

        const LEVEL_WIDTH = 6000; const LEVEL_HEIGHT = 4500; const GRAVITY = 1800;
        let gameState = 'start'; let score = 0; let lastTime = 0; let hitStopTimer = 0; let camera = { x: 0, y: 0 };
        let platforms = []; let enemies = []; let attacks = []; let particles = []; let wings = []; let ghosts = []; let damageTexts = [];

        function checkAABB(rect1, rect2) { return rect1.x < rect2.x + rect2.w && rect1.x + rect1.w > rect2.x && rect1.y < rect2.y + rect2.h && rect1.y + rect1.h > rect2.y; }

        function saveGame(locationName, x, y) {
            savePoint.name = locationName; savePoint.x = x; savePoint.y = y;
            saveBanner.style.opacity = '1';
            clearTimeout(saveBanner.fadeTimeout);
            saveBanner.fadeTimeout = setTimeout(() => saveBanner.style.opacity = '0', 2000);
        }

        function getSkillDamage(id) {
            let p = skillsProgress[id]; if (!p) return 2.5; 
            let lvl = p.level; let isEvo = p.evolved;
            switch(id) {
                case 'ground': return isEvo ? 6.5 + (lvl - 1) * 1.5 : 2.5 + (lvl - 1) * 1.0;
                case 'airUp': return isEvo ? 15.5 + (lvl - 1) * 2.5 : 2.5 + (lvl - 1) * 2.5;
                case 'airLong': return isEvo ? 10.5 + (lvl - 1) * 1.5 : 2.5 + (lvl - 1) * 1.5;
                case 'plunge': return isEvo ? 10.5 + (lvl - 1) * 2.0 : 2.5 + (lvl - 1) * 2.0;
                default: return 2.5;
            }
        }
        function getUpgradeCost(id) { let p = skillsProgress[id]; return p ? p.level * 10 : 999; }
        function getEvolveCost(id) { return 50; }

        function enableEditorMode() {
            if (editorMode) return;
            editorMode = true; document.getElementById('editor-badge').classList.remove('hidden');
            score = 999999;
            if (gamePlayer) { gamePlayer.maxHp = 9999; gamePlayer.hp = 9999; gamePlayer.isFlying = true; }
            updateUI(); showLocationBanner('編輯者模式', '已解鎖無限資源、倉庫、穿越與飛行(雙擊空白)', 'from-red-600', 'text-red-400');
            if (gameState === 'inventory') renderInventory();
        }

        window.toggleSetting = function(key) { if(globalSettings.hasOwnProperty(key)) globalSettings[key] = !globalSettings[key]; };
        window.openEquipSelect = function(slot) { invState.selectingEquipSlot = slot; renderInventory(); };
        window.closeEquipSelect = function() { invState.selectingEquipSlot = null; renderInventory(); };
        window.equipItem = function(slotType, itemId) {
            let k = slotType==='weapons'?'weapon':slotType==='armors'?'armor':slotType==='accessories'?'accessory':'legs';
            currentEquip[k] = itemId;
            document.getElementById('hud-attack-name').innerText = itemId === 'abyssal_blade' ? (skillsProgress.ground.evolved ? '影刃' : '普攻') : '揮拳';
            renderInventory();
        };
        window.stashGetItem = function(itemId) { if(itemId === 'abyssal_blade') { groundBlade.pickedUp = true; equipItem('weapons', 'abyssal_blade'); } };
        window.teleportTo = function(x, y, name) {
            if (gamePlayer) { gamePlayer.x = x; gamePlayer.y = y; gamePlayer.vx = 0; gamePlayer.vy = 0; }
            gameState = 'playing'; inventoryLayer.classList.add('hidden');
            showLocationBanner('穿越至', name, 'from-purple-600', 'text-purple-400');
            lastTime = performance.now(); if(gameLoopId) cancelAnimationFrame(gameLoopId); gameLoopId = requestAnimationFrame(gameLoop);
        };
        window.setCodexCategory = function(cat) { invState.codexCategory = cat; invState.selectedCodexItem = null; renderInventory(); };
        window.selectCodexItem = function(cat, id) { invState.codexCategory = cat; invState.selectedCodexItem = id; renderInventory(); };
        window.setInvTab = function(tab) { invState.tab = tab; invState.selectingEquipSlot = null; invState.codexCategory = null; invState.selectedCodexItem = null; renderInventory(); };
        window.toggleWeapon = function() { invState.weaponExpanded = !invState.weaponExpanded; renderInventory(); };
        window.upgradeSkill = function(id) {
            let cost = getUpgradeCost(id);
            if (score >= cost && skillsProgress[id].level < 5) { score -= cost; skillsProgress[id].level++; updateUI(); renderInventory(); }
        };
        window.evolveSkill = function(id) {
            let cost = getEvolveCost(id);
            if (score >= cost && skillsProgress[id].level === 5 && !skillsProgress[id].evolved) {
                score -= cost; skillsProgress[id].level = 1; skillsProgress[id].evolved = true;
                if (id === 'ground' && currentEquip.weapon === 'abyssal_blade') document.getElementById('hud-attack-name').innerText = '影刃';
                updateUI(); renderInventory();
            }
        };

        function getEquipIconHTML(slotKey, equipDataKey) {
            const itemId = currentEquip[slotKey];
            if (!itemId) return `<div class="w-full h-full flex items-center justify-center opacity-30 text-xs">空</div>`;
            const item = equipmentData[equipDataKey].find(x => x.id === itemId); return item ? item.icon : '';
        }

        function showLocationBanner(title, subtitle, c1, c2) {
            document.getElementById('loc-title').innerText = title; document.getElementById('loc-subtitle').innerText = subtitle;
            let line = document.getElementById('loc-line'); line.className = `h-1 w-full bg-gradient-to-r ${c1} to-transparent mt-2`;
            document.getElementById('loc-subtitle').className = `${c2} font-bold tracking-widest mt-1 text-sm uppercase opacity-80`;
            locationBanner.style.transition = 'opacity 1.5s ease-in'; locationBanner.style.opacity = '1';
            clearTimeout(locationBanner.fadeTimeout);
            locationBanner.fadeTimeout = setTimeout(() => { locationBanner.style.transition = 'opacity 1.5s ease-out'; locationBanner.style.opacity = '0'; }, 4500); 
        }

        function triggerMemoryUnlock(id) {
            timeScale = 0.15; slowMoTimer = 1.5; 
            memoryUnlockBanner.style.opacity = '1';
            clearTimeout(memoryUnlockBanner.fadeTimeout);
            memoryUnlockBanner.fadeTimeout = setTimeout(() => memoryUnlockBanner.style.opacity = '0', 3000);
        }

        function renderInventory() {
            if (editorMode) score = 999999;
            document.getElementById('inv-soul-display').innerText = score;
            let contentHtml = ''; let rightPanelTitle = '配置詳情';

            if (invState.selectingEquipSlot) {
                rightPanelTitle = '更換裝備';
                const slotMap = { 'weapons': '武器', 'armors': '裝甲', 'accessories': '吊飾', 'legs': '腿部' };
                const typeName = slotMap[invState.selectingEquipSlot]; const items = equipmentData[invState.selectingEquipSlot];
                contentHtml += `<div class="mb-3 text-xs sm:text-sm text-gray-300">選擇要裝備的 [${typeName}]：</div><div class="grid grid-cols-1 gap-2">`;
                if (items.length === 0) contentHtml += `<div class="text-center text-gray-500 py-6 text-sm font-bold bg-gray-900 rounded-lg border border-gray-700">目前暫無可用的 [${typeName}] 裝備</div>`;
                else {
                    items.forEach(item => {
                        let key = invState.selectingEquipSlot === 'weapons'?'weapon':invState.selectingEquipSlot.slice(0,-1);
                        const isEq = currentEquip[key] === item.id;
                        contentHtml += `
                            <button class="w-full text-left bg-gray-900 border ${isEq ? 'border-green-500 shadow-[0_0_8px_rgba(34,197,94,0.3)]' : 'border-gray-600 hover:border-gray-400'} rounded-lg p-2 flex gap-3 transition-all" onclick="equipItem('${invState.selectingEquipSlot}', '${item.id}')">
                                <div class="flex items-center justify-center bg-gray-800 w-10 h-10 rounded border border-gray-700 p-1">${item.icon}</div>
                                <div class="flex-1"><div class="flex justify-between items-center mb-1"><span class="font-bold text-sm ${item.rarity}">${item.name}</span>
                                ${isEq ? '<span class="text-green-400 text-[10px] font-bold px-1.5 py-0.5 bg-green-900 rounded">裝備中</span>' : ''}</div>
                                <div class="text-[10px] sm:text-xs text-gray-400">${item.desc}</div></div>
                            </button>`;
                    });
                }
                contentHtml += `</div><button class="mt-4 w-full py-2 bg-gray-700 hover:bg-gray-600 rounded font-bold text-xs sm:text-sm transition-colors" onclick="closeEquipSelect()">返回</button>`;
            } 
            else if (invState.tab === 'codex') {
                rightPanelTitle = '回憶紀錄';
                if (!invState.codexCategory) {

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(tankX - 80, tankY + 180); ctx.lineTo(tankX - 50, tankY + 80); ctx.lineTo(tankX - 30, tankY + 180); ctx.moveTo(tankX + 80, tankY + 180); ctx.lineTo(tankX + 60, tankY + 50); ctx.lineTo(tankX + 30, tankY + 180); ctx.stroke();
                }
                ctx.fillStyle = '#475569'; ctx.fillRect(tankX - 90, tankY - 200, 180, 20); ctx.fillRect(tankX - 90, tankY + 180, 180, 20); 
            }

            if (!ironDoor.isBroken) { ctx.fillStyle = '#2c3e50'; ctx.fillRect(ironDoor.x, ironDoor.y, ironDoor.w, ironDoor.h); ctx.strokeStyle = '#1a252f'; ctx.lineWidth = 2; for (let yy = ironDoor.y; yy < ironDoor.y + ironDoor.h; yy += 20) { ctx.strokeRect(ironDoor.x, yy, ironDoor.w, 20); } }
            if (camera.x > -800 && Math.random() < 0.2) createParticles(Math.max(0, camera.x + Math.random() * canvas.width), camera.y, 'rgba(100, 180, 150, 0.6)', 1, 0, true);

            for (let p of platforms) {
                if (p.x < 0) { ctx.fillStyle = '#1e293b'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle = '#334155'; ctx.fillRect(p.x, p.y, p.w, 4); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, p.h); } 
                else { ctx.fillStyle = '#111a16'; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle = '#1e3f2d'; ctx.fillRect(p.x, p.y, p.w, 6); for(let m = 0; m < p.w; m += 15) { let h = 5 + (Math.sin(p.x + m) * 10); if (h > 0) ctx.fillRect(p.x + m, p.y + 6, 8, h); } ctx.strokeStyle = '#070d0a'; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, p.h); }
            }

            if (!drawnPlayerInTank) gamePlayer.draw();
            enemies.forEach(e => e.draw()); particles.forEach(p => p.draw()); attacks.forEach(atk => atk.draw());
            if (globalSettings.showDamage) damageTexts.forEach(d => d.draw(ctx));
            ctx.restore(); 

            if (gameState === 'intro') {
                if (introState === 'black' || introState === 'waking') {
                    ctx.fillStyle = 'black'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    if (introState === 'waking') {
                        ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + Math.sin(Date.now()/200)*0.5})`; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
                        let shakeX = (Math.random() - 0.5) * jPressCount * 2; let shakeY = (Math.random() - 0.5) * jPressCount * 2; ctx.fillText(`[甦醒(敲擊 J 鍵破除玻璃)]`, canvas.width/2 + shakeX, canvas.height - 150 + shakeY);
                    }
                } else if (introState === 'shattering') { let alpha = 1 - (introTimer / 0.5); if (alpha > 0) { ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`; ctx.fillRect(0, 0, canvas.width, canvas.height); } }
            } else {
                let gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height/3, canvas.width/2, canvas.height/2, canvas.width);
                gradient.addColorStop(0, 'rgba(0,0,0,0)'); gradient.addColorStop(1, 'rgba(0,0,0,0.7)'); ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            if (gameState === 'playing' || gameState === 'intro' || gameState === 'cutscene') gameLoopId = requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', initGame, { once: true });
        ctx.fillStyle = '#050a08'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    </script>
