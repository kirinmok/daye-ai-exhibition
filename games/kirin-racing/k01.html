<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>便當快遞 K-01 | 水城救援隊</title>
<style>
:root{
  --cream:#FFF8E7; --sky:#7EC8E3; --grass:#A8D672;
  --btn1:#FFB347; --btn2:#FF8C42; --ok:#6BCB77; --bad:#FF6B6B;
  --ink:#4A3728;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Nunito","Varela Round","jf-openhuninn","Noto Sans TC",system-ui,sans-serif;
  background:var(--cream);color:var(--ink);overflow:hidden;user-select:none}
#c3d{position:fixed;inset:0;z-index:0}

.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;padding:24px;
  background:rgba(255,248,231,0.92);opacity:0;pointer-events:none;
  transition:opacity .3s}
.screen.show{opacity:1;pointer-events:auto}

h1{font-size:clamp(28px,6vw,44px);font-weight:900;letter-spacing:2px;text-align:center}
h2{font-size:clamp(22px,4.5vw,32px);font-weight:900;letter-spacing:1px;text-align:center}
.sub{font-size:18px;opacity:.75;text-align:center;line-height:1.6}

.btn{border:none;border-radius:24px;min-height:64px;padding:14px 36px;
  font-size:22px;font-weight:900;letter-spacing:1px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--btn1),var(--btn2));
  box-shadow:0 8px 24px rgba(74,55,40,.25),inset 0 2px 0 rgba(255,255,255,.4);
  transition:transform .12s cubic-bezier(.34,1.56,.64,1);font-family:inherit}
.btn:active{transform:scale(.92)}
.btn.wide{width:min(420px,88vw)}
.btn:disabled{opacity:.35;pointer-events:none}

.card{background:#fff;border-radius:20px;padding:28px 32px;
  box-shadow:0 8px 24px rgba(74,55,40,.15);max-width:min(560px,94vw);
  display:flex;flex-direction:column;gap:18px;align-items:center}

#missionBar{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:5;
  background:#fff;border-radius:999px;padding:12px 30px;font-size:clamp(17px,3.4vw,24px);
  font-weight:900;box-shadow:0 8px 24px rgba(74,55,40,.2);white-space:nowrap;
  opacity:0;transition:opacity .5s}
#missionBar.show{opacity:1}
#keyHint{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);z-index:5;
  font-size:17px;font-weight:700;background:rgba(255,255,255,.9);border-radius:999px;
  padding:10px 24px;box-shadow:0 4px 14px rgba(74,55,40,.15);opacity:0;transition:opacity .6s}
#keyHint.show{opacity:1}

#bentoHud{position:fixed;top:20px;right:20px;z-index:6;background:#fff;
  border-radius:999px;padding:10px 22px;font-size:26px;font-weight:900;
  box-shadow:0 8px 24px rgba(74,55,40,.2);display:none;align-items:center;gap:8px}
#bentoHud.show{display:flex}
#bentoHud.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}
  50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
#bentoNum{color:var(--btn2)}

#dropMsg{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.6);z-index:7;
  font-size:clamp(24px,5vw,36px);font-weight:900;color:var(--bad);
  background:#fff;border-radius:20px;padding:16px 32px;
  box-shadow:0 10px 30px rgba(255,107,107,.35);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}
#dropMsg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.opts{display:flex;flex-direction:column;gap:14px;width:100%}
.opt{border:3px solid transparent;border-radius:20px;background:var(--cream);
  padding:18px 22px;font-size:19px;font-weight:800;cursor:pointer;text-align:left;
  transition:transform .12s,border-color .2s;font-family:inherit;color:var(--ink)}
.opt:active{transform:scale(.96)}
.opt.dim{opacity:.35;pointer-events:none;text-decoration:line-through}

.garageRow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.carCard{background:var(--cream);border:4px solid transparent;border-radius:20px;
  padding:20px;width:180px;cursor:pointer;text-align:center;
  transition:transform .15s,border-color .2s;display:flex;flex-direction:column;gap:8px;
  align-items:center}
.carCard:active{transform:scale(.94)}
.carCard.sel{border-color:var(--btn2);background:#fff}
.carCard .nm{font-weight:900;font-size:18px}
.carCard .desc{font-size:13px;opacity:.7;line-height:1.5}
.carShape{background:#C68B4E;border-radius:6px;border:3px solid #8f5f30}
.carShape.sq{width:60px;height:60px}
.carShape.rect{width:48px;height:88px}
.carShape.narrow{width:36px;height:76px}
.newTag{background:var(--bad);color:#fff;font-size:12px;font-weight:900;
  border-radius:999px;padding:2px 10px}

.confetti{position:fixed;top:-16px;z-index:20;width:12px;height:12px;border-radius:3px;
  pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.medal{font-size:88px;animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}

#fade{position:fixed;inset:0;background:var(--cream);z-index:30;opacity:1;
  transition:opacity .8s;pointer-events:none}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="fade"></div>

<div id="missionBar">🍱 把 3 箱便當送到文化夜市 →</div>
<div id="keyHint">🎮 W 前進 · A / D 方向</div>
<div id="bentoHud">📦 <span id="bentoNum">3</span></div>
<div id="dropMsg">💦 便當掉了！</div>

<div class="screen" id="sResult">
  <div class="card">
    <h2 id="resTitle">送達 1 / 3 箱</h2>
    <p class="sub" id="resQ"></p>
    <div class="opts" id="resOpts"></div>
  </div>
</div>

<div class="screen" id="sGarage">
  <div class="card">
    <h2>🔧 工坊 — 換車身</h2>
    <div class="garageRow" id="garageRow"></div>
    <button class="btn wide" id="garageGo" disabled>換好了，再送一次！</button>
  </div>
</div>

<div class="screen" id="sWin">
  <div class="card">
    <div class="medal" id="winMedal">🎓</div>
    <h1 id="winTitle">工程師認證 Lv.1</h1>
    <p class="sub" id="winSub">3 箱便當全部送達！</p>
    <p class="sub" id="hookText" style="font-weight:800;color:var(--btn2)"></p>
    <button class="btn wide" id="winNext">▶ 繼續</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
<script>
/* ═════════ K-01 便當快遞(雙關卡) — 情境驅動 ═════════
   A 直線大道: 方形車飄 → 長方形解
   B 夜市窄巷: 長方形卡彎 → 窄長載貨板解
   loop: 失敗 → 押假設 → 改裝 → 驗證 → 鉤子 */

const CAR_SPECS = {
  sq:     { dims:[2.4,.3,2.4], turn:1.6, sway:3.2, nm:'方形板車' },
  rect:   { dims:[1.9,.3,4.2], turn:0.75, sway:0.4, nm:'長方形板車' },
  narrow: { dims:[1.5,.3,3.4], turn:1.25, sway:0.9, nm:'窄長載貨板' },
};
const TIRES = {
  std:  { windRes:1.0, nm:'普通胎', desc:'一般路面 OK<br>濕地會滑' },
  grip: { windRes:0.35, nm:'防滑寬胎', desc:'咬住濕路面<br>抗側風' },
};

const MISSIONS = {
  A: {
    bar:'🍱 把 3 箱便當送到文化夜市 →',
    path:[[0,4],[0,-125]], laneW:10, walls:false,
    q:'車子直線一直飄，你覺得是為什麼？',
    opts:[
      {t:'🚗 車身太短，容易左右晃', ok:true},
      {t:'🛞 輪子太滑', ok:false},
      {t:'😅 我技術太爛', ok:false}],
    garage:['sq','rect'], answer:'rect',
    winT:'工程師認證 Lv.1', winS:'3 箱便當全部送達！',
    hook:'長車直線超穩！但夜市裡面的巷子…好像很窄？',
    nextBtn:'▶ 挑戰夜市窄巷',
  },
  B: {
    bar:'🏮 穿過夜市窄巷，送到攤位 →',
    path:[[0,4],[0,-40],[30,-40],[30,-85],[0,-85],[0,-125]], laneW:7, walls:true,
    q:'一轉彎就卡牆，你覺得是為什麼？',
    opts:[
      {t:'📏 車身太長，彎不過去', ok:true},
      {t:'💨 速度太快', ok:false},
      {t:'🛞 輪胎抓不住地', ok:false}],
    garage:['sq','rect','narrow'], answer:'narrow',
    winT:'工程師認證 Lv.2', winS:'窄巷全通過，攤位老闆比讚！',
    hook:'沒有完美的車，只有適合任務的車。⋯⋯天氣預報：颱風接近中 🌀',
    nextBtn:'▶ 颱風要來了！',
  },
  C: {
    bar:'🌀 颱風前！運 3 袋沙包去老屋 →',
    path:[[0,4],[0,-50],[-26,-50],[-26,-100],[0,-100],[0,-135]], laneW:9,
    walls:false, storm:true, wind:0.9,
    q:'車一直被往旁邊推，你覺得是為什麼？',
    opts:[
      {t:'🌀 颱風的側風在推車', ok:true},
      {t:'🛞 輪胎壞掉了', ok:false},
      {t:'🛣 路是斜的', ok:false}],
    garageType:'tire', garage:['std','grip'], answer:'grip',
    winT:'工程師認證 Lv.3', winS:'沙包送達，老屋保住了！',
    hook:'防滑寬胎咬住了路面！⋯⋯但雨越下越大，路開始積水了 🌊',
    nextBtn:'▶ 進入水城救援本篇',
  },
};

const S = { mission:'A', body:'sq', tire:'std', bento:3 };

/* ── Three.js ── */
const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7EC8E3);
scene.fog = new THREE.Fog(0x7EC8E3, 60, 170);
const cam = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, .1, 300);
scene.add(new THREE.AmbientLight(0xffffff, .85));
const sun = new THREE.DirectionalLight(0xfff2cc, 1.1);
sun.position.set(30,60,20); scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(500,500),
  new THREE.MeshLambertMaterial({color:0xA8D672}));
ground.rotation.x = -Math.PI/2; ground.position.y=-0.02; scene.add(ground);

/* ── 賽道群組(依 mission 重建) ── */
let trackGroup = null, PATH = [], LANE_W = 10, FINISH = new THREE.Vector3();

function v2(p){ return new THREE.Vector2(p[0], p[1]); }

let rainPts = null;
function buildTrack(mid){
  if(trackGroup) scene.remove(trackGroup);
  if(rainPts){ scene.remove(rainPts); rainPts=null; }
  trackGroup = new THREE.Group();
  const M = MISSIONS[mid];
  PATH = M.path.map(v2); LANE_W = M.laneW;
  /* 颱風天氣 */
  if(M.storm){
    scene.background = new THREE.Color(0x8A96A3);
    scene.fog = new THREE.Fog(0x8A96A3, 40, 130);
    ground.material.color.setHex(0x7FA357);
    const rg = new THREE.BufferGeometry();
    const N=600, pos=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      pos[i*3]=(Math.random()-.5)*120;
      pos[i*3+1]=Math.random()*40;
      pos[i*3+2]=-Math.random()*200;
    }
    rg.setAttribute('position', new THREE.BufferAttribute(pos,3));
    rainPts = new THREE.Points(rg,
      new THREE.PointsMaterial({color:0xcfe3ff,size:.35,transparent:true,opacity:.7}));
    scene.add(rainPts);
  } else {
    scene.background = new THREE.Color(0x7EC8E3);
    scene.fog = new THREE.Fog(0x7EC8E3, 60, 170);
    ground.material.color.setHex(0xA8D672);
  }
  const roadM = new THREE.MeshLambertMaterial({color:0xEDE3D0});
  const dashM = new THREE.MeshLambertMaterial({color:0xffffff});

  for(let i=0;i<PATH.length-1;i++){
    const a=PATH[i], b=PATH[i+1];
    const len = a.distanceTo(b);
    const mid2 = a.clone().add(b).multiplyScalar(.5);
    const ang = Math.atan2(b.x-a.x, b.y-a.y);
    const seg = new THREE.Mesh(new THREE.PlaneGeometry(LANE_W, len+LANE_W), roadM);
    seg.rotation.x = -Math.PI/2; seg.rotation.z = -ang;
    seg.position.set(mid2.x, 0, mid2.y);
    trackGroup.add(seg);
    const n = Math.floor(len/9);
    for(let d=1;d<n;d++){
      const t = d/n;
      const px = a.x+(b.x-a.x)*t, pz = a.y+(b.y-a.y)*t;
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(.5,3), dashM);
      dash.rotation.x = -Math.PI/2; dash.rotation.z = -ang;
      dash.position.set(px,.01,pz);
      trackGroup.add(dash);
    }
    /* B 關:窄巷牆(磚牆+燈籠) */
    if(M.walls){
      const wallM = new THREE.MeshLambertMaterial({color:0xE8C99B});
      const dir = b.clone().sub(a).normalize();
      const norm = new THREE.Vector2(-dir.y, dir.x);
      [-1,1].forEach(sd=>{
        const off = norm.clone().multiplyScalar(sd*(LANE_W/2+0.6));
        const w = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.2, len-LANE_W*0.6), wallM);
        w.rotation.y = -ang;
        w.position.set(mid2.x+off.x, 1.6, mid2.y+off.y);
        trackGroup.add(w);
        const nL = Math.floor(len/12);
        for(let d=1;d<nL;d++){
          const t=d/nL;
          const lp = new THREE.Mesh(new THREE.SphereGeometry(.45,8,8),
            new THREE.MeshLambertMaterial({color:0xFF6B6B}));
          lp.position.set(a.x+(b.x-a.x)*t+off.x, 3.6, a.y+(b.y-a.y)*t+off.y);
          trackGroup.add(lp);
        }
      });
    }
  }
  /* 路邊樹(A 關) */
  if(!M.walls){
    for(let i=0;i<26;i++){
      const side = i%2?1:-1;
      const tr = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.3,.4,1.6),
        new THREE.MeshLambertMaterial({color:0x8f5f30}));
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.4,8,8),
        new THREE.MeshLambertMaterial({color:0x6BCB77}));
      leaf.position.y=1.8; tr.add(trunk,leaf);
      tr.position.set(side*(8+Math.random()*6), .8, -i*8-4);
      trackGroup.add(tr);
    }
  }
  /* 終點牌樓 */
  const last = PATH[PATH.length-1], prev = PATH[PATH.length-2];
  const endAng = Math.atan2(last.x-prev.x, last.y-prev.y);
  FINISH.set(last.x, 0, last.y);
  const gate = new THREE.Group();
  const postM = new THREE.MeshLambertMaterial({color:0xd9483b});
  [[-6],[6]].forEach(([x])=>{
    const p = new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,9), postM);
    p.position.set(x,4.5,0); gate.add(p);
  });
  const beam = new THREE.Mesh(new THREE.BoxGeometry(14,1.6,1), postM);
  beam.position.y=8.6; gate.add(beam);
  const signCv = document.createElement('canvas'); signCv.width=512; signCv.height=96;
  const sc = signCv.getContext('2d');
  sc.fillStyle='#ffd966'; sc.fillRect(0,0,512,96);
  sc.fillStyle='#4A3728'; sc.font='900 52px "Noto Sans TC",sans-serif';
  sc.textAlign='center'; sc.textBaseline='middle';
  sc.fillText(mid==='A'?'🏮 文化夜市 🏮': mid==='B'?'🍜 目標攤位 🍜':'🏠 阿嬤的老屋 🏠',256,50);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(12,2.2),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(signCv), side:THREE.DoubleSide}));
  sign.position.y=8.6; sign.position.z=.55; gate.add(sign);
  gate.rotation.y = -endAng;
  gate.position.set(last.x, 0, last.y);
  trackGroup.add(gate);
  scene.add(trackGroup);
}

/* 點到折線距離 + 最近點 */
function distToPath(px, pz){
  let best = Infinity, bx=0, bz=0;
  for(let i=0;i<PATH.length-1;i++){
    const a=PATH[i], b=PATH[i+1];
    const abx=b.x-a.x, abz=b.y-a.y;
    const t = Math.max(0, Math.min(1,
      ((px-a.x)*abx+(pz-a.y)*abz)/(abx*abx+abz*abz)));
    const cx=a.x+abx*t, cz=a.y+abz*t;
    const d = Math.hypot(px-cx, pz-cz);
    if(d<best){ best=d; bx=cx; bz=cz; }
  }
  return {d:best, x:bx, z:bz};
}

/* ── 板車 ── */
const car = new THREE.Group();
let boardMesh=null;
const wheelM = new THREE.MeshLambertMaterial({color:0x4A3728});
const wheels=[];
function buildBoard(kind){
  if(boardMesh) car.remove(boardMesh);
  wheels.forEach(w=>car.remove(w)); wheels.length=0;
  const dims = CAR_SPECS[kind].dims;
  boardMesh = new THREE.Mesh(new THREE.BoxGeometry(...dims),
    new THREE.MeshLambertMaterial({color:0xC68B4E}));
  boardMesh.position.y=.6; car.add(boardMesh);
  const [w,,l]=dims;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const wh = new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.32,14), wheelM);
    wh.rotation.z=Math.PI/2;
    wh.position.set(sx*(w/2-.1), .42, sz*(l/2-.35));
    car.add(wh); wheels.push(wh);
  });
}
const bentoBoxes=[];
function buildBento(){
  bentoBoxes.forEach(b=>{ (b.parent||car).remove(b); }); bentoBoxes.length=0;
  const isSand = MISSIONS[S.mission].storm;
  for(let i=0;i<S.bento;i++){
    const b = new THREE.Group();
    if(isSand){
      const bag = new THREE.Mesh(new THREE.SphereGeometry(.55,10,8),
        new THREE.MeshLambertMaterial({color:0xB8A16E}));
      bag.scale.set(1,.7,1); b.add(bag);
    } else {
      const box = new THREE.Mesh(new THREE.BoxGeometry(.9,.55,.9),
        new THREE.MeshLambertMaterial({color:0xFF8C42}));
      const lid = new THREE.Mesh(new THREE.BoxGeometry(.95,.12,.95),
        new THREE.MeshLambertMaterial({color:0xC0392B}));
      lid.position.y=.33; b.add(box,lid);
    }
    b.position.set(0, 1.1+i*.62, -0.4);
    car.add(b); bentoBoxes.push(b);
  }
}
scene.add(car);

/* ── 控制/物理 ── */
const key={};
addEventListener('keydown',e=>key[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>key[e.key.toLowerCase()]=false);
let speed=0, heading=0, swayAcc=0, driving=false, wallCooldown=0;

function resetCar(){
  const p0=PATH[0], p1=PATH[1];
  heading = -Math.atan2(p1.x-p0.x, p1.y-p0.y) + Math.PI;
  car.position.set(p0.x,0,p0.y); car.rotation.y=heading;
  speed=0; swayAcc=0; wallCooldown=0; S.bento=3;
  clearDropped();
  buildBoard(S.body); buildBento(); updateHud();
}

const droppedItems=[];
function dropBento(){
  if(S.bento<=0) return;
  S.bento--;
  const b=bentoBoxes.pop();
  const dir=Math.random()>.5?1:-1;
  scene.attach(b);
  let t=0;
  const iv=setInterval(()=>{
    t+=.05; b.position.x+=dir*.32; b.position.y=Math.max(.35,b.position.y-.15);
    b.rotation.z+=dir*.35;
    if(t>=1){
      clearInterval(iv);
      b.position.y=.35;
      /* 掉出路太遠就拉回路邊,保證撿得到 */
      const near=distToPath(b.position.x,b.position.z);
      if(near.d > LANE_W/2+1.5){
        const px=b.position.x-near.x, pz=b.position.z-near.z;
        const pd=Math.hypot(px,pz)||.01;
        b.position.x=near.x+px/pd*(LANE_W/2-1);
        b.position.z=near.z+pz/pd*(LANE_W/2-1);
      }
      droppedItems.push(b);
      /* 呼吸提示光暈:上下浮動 */
      b.userData.bob=Math.random()*6;
    }
  },30);
  const hud=document.getElementById('bentoHud');
  hud.classList.add('shake'); setTimeout(()=>hud.classList.remove('shake'),450);
  updateHud();
  const dm=document.getElementById('dropMsg');
  if(S.bento<=0){
    dm.textContent='😱 全掉光了！回頭撿還來得及 ↩';
  } else {
    dm.textContent = MISSIONS[S.mission].storm? '💨 沙包被吹掉了！迴轉去撿 ↩':'💦 便當掉了！迴轉去撿 ↩';
  }
  dm.classList.add('show'); setTimeout(()=>dm.classList.remove('show'),1600);
}
function pickupBento(b){
  const i=droppedItems.indexOf(b);
  if(i<0) return;
  droppedItems.splice(i,1);
  scene.remove(b);
  S.bento++;
  car.attach(b);
  b.rotation.set(0,0,0);
  b.position.set(0, 1.1+(bentoBoxes.length)*.62, -0.4);
  bentoBoxes.push(b);
  wallCooldown=1.5;
  updateHud();
  const dm=document.getElementById('dropMsg');
  dm.textContent='✨ 撿回來了！';
  dm.style.color='var(--ok)';
  dm.classList.add('show');
  setTimeout(()=>{dm.classList.remove('show'); dm.style.color='';},900);
}
function clearDropped(){
  droppedItems.forEach(b=>scene.remove(b));
  droppedItems.length=0;
}
function updateHud(){ document.getElementById('bentoNum').textContent=S.bento; }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  if(id) document.getElementById(id).classList.add('show'); }

/* ── 流程 ── */
function startDrive(){
  driving=true; resetCar(); show(null);
  document.getElementById('bentoHud').classList.add('show');
}

function finishDrive(){
  driving=false;
  document.getElementById('bentoHud').classList.remove('show');
  const M=MISSIONS[S.mission];
  if(S.bento>=3 && S.body===M.answer) return winScreen();
  if(S.bento>=3) return winScreen();  /* 技術好硬闖成功也放行 */
  /* 押假設 */
  const opts=document.getElementById('resOpts');
  document.getElementById('resTitle').textContent=`送達 ${S.bento} / 3 箱`;
  document.getElementById('resQ').textContent=M.q;
  opts.innerHTML='';
  M.opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o.t;
    b.onclick=()=>{
      if(o.ok) openGarage();
      else{ b.classList.add('dim');
        document.getElementById('resQ').textContent='嗯…好像不是這個原因。再想想？'; }
    };
    opts.appendChild(b);
  });
  show('sResult');
}

function openGarage(){
  const M=MISSIONS[S.mission];
  const gRow=document.getElementById('garageRow');
  const isTire = M.garageType==='tire';
  document.querySelector('#sGarage h2').textContent =
    isTire? '🔧 工坊 — 換輪胎' : '🔧 工坊 — 換車身';
  gRow.innerHTML='';
  M.garage.forEach(id=>{
    const d=document.createElement('div');
    if(isTire){
      const t=TIRES[id];
      const isNew = id==='grip';
      const cur = id===S.tire;
      d.className='carCard'+(cur?' sel':'');
      d.innerHTML=`${isNew?'<span class="newTag">NEW</span>':''}
        <div style="font-size:52px">${id==='grip'?'🛞':'⚪'}</div>
        <div class="nm">${t.nm}</div><div class="desc">${t.desc}</div>`;
      d.onclick=()=>{
        S.tire=id;
        document.querySelectorAll('.carCard').forEach(x=>x.classList.remove('sel'));
        d.classList.add('sel');
        document.getElementById('garageGo').disabled=false;
      };
    } else {
      const c=CAR_SPECS[id];
      const isNew = (S.mission==='B' && id==='narrow');
      d.className='carCard'+(id===S.body?' sel':'');
      const descs={sq:'轉彎靈活<br>直線會飄', rect:'直線穩定<br>轉彎半徑大', narrow:'巷弄靈活<br>穩又能載貨'};
      d.innerHTML=`${isNew?'<span class="newTag">NEW</span>':''}
        <div class="carShape ${id}"></div>
        <div class="nm">${c.nm}</div><div class="desc">${descs[id]}</div>`;
      d.onclick=()=>{
        S.body=id;
        document.querySelectorAll('.carCard').forEach(x=>x.classList.remove('sel'));
        d.classList.add('sel');
        document.getElementById('garageGo').disabled=false;
      };
    }
    gRow.appendChild(d);
  });
  document.getElementById('garageGo').disabled=true;
  document.getElementById('garageGo').onclick=()=>startDrive();
  show('sGarage');
}

function confetti(){
  const colors=['#FFB347','#6BCB77','#7EC8E3','#FF6B6B','#FFD966'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%5];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    c.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

function winScreen(){
  confetti();
  const M=MISSIONS[S.mission];
  document.getElementById('winMedal').textContent = {A:'🎓',B:'🏆',C:'🛡️'}[S.mission];
  document.getElementById('winTitle').textContent=M.winT;
  document.getElementById('winSub').textContent=M.winS;
  document.getElementById('hookText').textContent=M.hook;
  document.getElementById('winNext').textContent=M.nextBtn;
  document.getElementById('winNext').onclick=()=>{
    if(S.mission==='A'){ S.mission='B'; launchMission('B'); }
    else if(S.mission==='B'){ S.mission='C'; launchMission('C'); }
    else { location.href='index.html?from=k01&cert=3'; }
  };
  show('sWin');
}

function launchMission(mid){
  show(null);
  buildTrack(mid);
  const M=MISSIONS[mid];
  const bar=document.getElementById('missionBar');
  bar.textContent=M.bar; bar.classList.add('show');
  setTimeout(()=>bar.classList.remove('show'), 7000);
  startDrive();
}

/* ── 主迴圈 ── */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(driving){
    const spec=CAR_SPECS[S.body];
    if(key['w']||key['arrowup']) speed=Math.min(speed+18*dt,26);
    else speed=Math.max(speed-14*dt,0);
    if(key['a']||key['arrowleft']) heading+=spec.turn*dt*(speed>1?1:0);
    if(key['d']||key['arrowright']) heading-=spec.turn*dt*(speed>1?1:0);
    if(spec.sway>1 && speed>4){
      swayAcc+=(Math.random()-.5)*spec.sway*dt; swayAcc*=.985;
    } else swayAcc*=.9;
    heading+=swayAcc*dt*2;
    /* 颱風側風:固定方向推力,防滑寬胎抗 65% */
    const Mw = MISSIONS[S.mission];
    if(Mw.wind && speed>2){
      car.position.x += Mw.wind * TIRES[S.tire].windRes * dt * (speed/8);
    }

    car.rotation.y=heading;
    car.position.x+=Math.sin(heading)*-speed*dt;
    car.position.z+=Math.cos(heading)*-speed*dt;

    const near=distToPath(car.position.x, car.position.z);
    if(wallCooldown>0) wallCooldown-=dt;
    if(near.d > LANE_W/2-0.8 && speed>3){
      /* 撞牆/出路面:推回 + 掉箱(冷卻) */
      const px=car.position.x-near.x, pz=car.position.z-near.z;
      const pd=Math.hypot(px,pz)||.01;
      car.position.x=near.x+px/pd*(LANE_W/2-0.9);
      car.position.z=near.z+pz/pd*(LANE_W/2-0.9);
      speed*=0.5;
      if(wallCooldown<=0){ dropBento(); wallCooldown=1.5; }
    }
    if(Math.abs(swayAcc)>1.15 && speed>12){ dropBento(); swayAcc=0; }
    wheels.forEach(w=>w.rotation.x+=speed*dt*2);
    /* 撿回掉落的貨物 */
    let nearestDrop = Infinity;
    for(let i=droppedItems.length-1;i>=0;i--){
      const b=droppedItems[i];
      b.userData.bob+=dt*4;
      b.position.y=.35+Math.sin(b.userData.bob)*.15;
      b.rotation.y+=dt*2;
      const dx=car.position.x-b.position.x, dz=car.position.z-b.position.z;
      const d2=dx*dx+dz*dz;
      if(d2 < 6.5) pickupBento(b);
      else if(d2 < nearestDrop) nearestDrop = d2;
    }
    /* 全掉智慧結算:貨全掉光又開離掉落點太遠 = 玩家放棄,直接進檢討 */
    if(S.bento<=0 && droppedItems.length>0 && nearestDrop > 35*35){
      finishDrive();
    }
    if(car.position.distanceTo(FINISH)<5) finishDrive();
  }
  /* 雨落下 */
  if(rainPts){
    const pa = rainPts.geometry.attributes.position;
    for(let i=0;i<pa.count;i++){
      let y = pa.getY(i) - 28*dt;
      if(y<0) y = 40;
      pa.setY(i, y);
      pa.setX(i, pa.getX(i) + 6*dt);
      if(pa.getX(i)>60) pa.setX(i,-60);
    }
    pa.needsUpdate = true;
    rainPts.position.z = car.position.z - 80;
  }
  const camT=new THREE.Vector3(
    car.position.x+Math.sin(heading)*10*.4 + Math.sin(heading)*0,
    7.5,
    car.position.z+Math.cos(heading)*13);
  /* 鏡頭跟在車後方(依 heading) */
  camT.set(
    car.position.x - Math.sin(heading)*-13,
    7.5,
    car.position.z - Math.cos(heading)*-13);
  cam.position.lerp(camT,.08);
  cam.lookAt(car.position.x,1.5,
    car.position.z+Math.cos(heading)*-6);
  renderer.render(scene,cam);
}
animate();

addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ── 開場 ── */
buildTrack('A');
resetCar();
setTimeout(()=>{document.getElementById('fade').style.opacity=0;},300);
setTimeout(()=>{
  document.getElementById('missionBar').classList.add('show');
  document.getElementById('keyHint').classList.add('show');
  startDrive();
},1100);
setTimeout(()=>{document.getElementById('keyHint').classList.remove('show');},7000);
setTimeout(()=>{document.getElementById('missionBar').classList.remove('show');},9000);
</script>
